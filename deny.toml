[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2026-0009 (time <0.3.47 stack-exhaustion DoS via RFC 2822
    # parsing) used to be ignored here: `zcash_client_backend` pinned
    # `time-core = "=0.1.2"`, which held `time` below the fixed release. The
    # librustzcash bump drops that pin, so `time` now resolves to 0.3.55 and
    # the advisory no longer applies.
    #
    # proc-macro-error2 is unmaintained. It is a build-time proc-macro
    # dependency only (no runtime code path), pulled in transitively by
    # orchard (via getset) and age (via i18n-embed-fl); there is no
    # first-party use and "no safe upgrade is available" per the advisory.
    # "Unmaintained" is informational, not a vulnerability. Revisit once the
    # upstream Zcash/age crates migrate off it.
    "RUSTSEC-2026-0173",
]

[licenses]
version = 2
# Crate is MIT OR Apache-2.0; permit the usual permissive set for
# transitive deps. Tighten as needed if `cargo deny` complains.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
    "OpenSSL",
    # webpki-roots: Mozilla CA root certificate bundle.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Nothing comes from git. The Ironwood (NU6.3) crate set used to be pinned to
# git revisions of zcash/librustzcash, zcash/orchard, and
# zcash/incrementalmerkletree via [patch.crates-io] in the workspace
# Cargo.toml, because the wallet crates' crates.io releases still linked the
# pre-Ironwood consensus crates; all of it is published now and the patches are
# gone. zecd, the wallet engine, is `=0.8.0-rc2` from crates.io as well, so
# there is no `allow-git` at all and a new git source is a build failure rather
# than a judgement call.
