[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # time <0.3.47 stack-exhaustion DoS via RFC 2822 parsing. Reached only
    # through rusqlite's internal timestamp handling; zkv never feeds user
    # input into RFC 2822 parsers. Pin is enforced upstream by
    # `zcash_client_backend`'s `time-core = "=0.1.2"` requirement, so we
    # can't bump until librustzcash relaxes it.
    "RUSTSEC-2026-0009",
    # proc-macro-error2 is unmaintained. It is a build-time proc-macro
    # dependency only (no runtime code path), pulled in transitively by
    # orchard (via getset) and age (via i18n-embed-fl); there is no
    # first-party use and "no safe upgrade is available" per the advisory.
    # "Unmaintained" is informational, not a vulnerability. Revisit once the
    # upstream Zcash/age crates migrate off it.
    "RUSTSEC-2026-0173",
]

[licenses]
version = 2
# Crate is MIT OR Apache-2.0; permit the usual permissive set for
# transitive deps. Tighten as needed if `cargo deny` complains.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
    "OpenSSL",
    # webpki-roots: Mozilla CA root certificate bundle.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
