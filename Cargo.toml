[package]
name = "zkv-workspace-tests"
version = "0.0.0"
edition = "2021"
publish = false
# This root package exists only to host the workspace-level integration
# test at `tests/address_validation.rs`, which is intentionally an
# *external* consumer of the `zkv` crate's public surface. No [lib] /
# [[bin]] targets.

[[test]]
name = "address_validation"
path = "tests/address_validation.rs"

[[test]]
name = "facade_smoke"
path = "tests/facade_smoke.rs"

[[test]]
name = "gui_forget"
path = "tests/gui_forget.rs"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
zkv = { workspace = true }

[profile.release]
strip = true

[workspace]
resolver = "2"
members = ["crates/zkv", "crates/zkv-oracle", "crates/zkv-version-oracle"]
# Directories that may exist inside the repo checkout but are NOT members:
# the regtest harness is deliberately its own workspace (own lockfile; see
# regtest-harness/README.md), and the Regtest E2E CI workflow checks out
# zcash-devtool (the funding wallet) into the repo root, where cargo's
# directory traversal would otherwise try to claim it for this workspace.
exclude = ["regtest-harness", "zcash-devtool"]

[workspace.dependencies]
# Internal crate (path resolved relative to the workspace root, so the faucet
# and these root tests reference it identically).
zkv = { path = "crates/zkv", version = "0.0.1-rc4" }

# Shared third-party deps. Versions live here so the member crates (and the
# workspace-root integration tests) can't drift; per-crate feature sets and
# `optional` / `default-features` stay on the member declaration.
anyhow = "1"
clap = { version = "4.5", features = ["derive", "string"] }
hex = "0.4"
rand = { version = "0.8", default-features = false }
rusqlite = { version = "0.37", features = ["time", "uuid"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.21" }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
axum = { version = "0.7", default-features = false, features = ["tokio", "http1", "json"] }

# Zcash ecosystem: version-locked as a set.
#
# Ironwood (NU6.3 / V6 transaction) support, consumed **straight from crates.io**
# (same model as zecd): the released Ironwood librustzcash line carries the NU6.3
# mainnet activation height (3_428_143, 2026-07-28) that the old `-pre` git pin
# lacked; with the pin, transactions built after mainnet activation would commit
# to the NU6.2 branch ID and be rejected. Leaf crates are finals
# (`zcash_primitives`/`zcash_proofs 0.29`, `orchard 0.15`, `zcash_protocol 0.10`,
# `zcash_keys 0.15`); the wallet crates ride the release candidates
# (`zcash_client_backend 0.24.0-rc.1`, `zcash_client_sqlite 0.22.0-rc.1`,
# `pczt 0.8.0-rc.1`, `zip321 0.9.0-rc.1`). The shardtree checkpoint-retention
# APIs (#184) and the checkpoint-prune panic fix (#192) both shipped in
# `shardtree 0.7.0`, so the incrementalmerkletree git pins are gone too: no
# forks, no git pins, no [patch.crates-io].
transparent = { package = "zcash_transparent", version = "0.9" }
zcash_address = "0.13"
zcash_note_encryption = "0.4.2"
# The wallet RCs are `=`-pinned: later RCs in the same line moved to
# `zcash_keys 0.16`, which would split the graph into two zcash_keys versions
# (zecd pins the same rc.1 pair).
zcash_client_backend = { version = "=0.24.0-rc.1", features = ["lightwalletd-tonic-tls-webpki-roots", "orchard", "pczt"] }
zcash_client_sqlite = { version = "=0.22.0-rc.1", features = ["unstable", "orchard", "serde"] }
zcash_keys = { version = "0.15.0", features = ["orchard", "unstable"] }
zcash_primitives = "0.29"
zcash_protocol = { version = "0.10", features = ["local-consensus"] }
zip32 = "0.2"
zip321 = "=0.9.0-rc.1"

