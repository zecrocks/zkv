[package]
name = "zkv-workspace-tests"
version = "0.0.0"
edition = "2021"
publish = false
# This root package exists only to host the workspace-level integration
# test at `tests/address_validation.rs`, which is intentionally an
# *external* consumer of the `zkv` crate's public surface. No [lib] /
# [[bin]] targets.

[[test]]
name = "address_validation"
path = "tests/address_validation.rs"

[[test]]
name = "facade_smoke"
path = "tests/facade_smoke.rs"

[[test]]
name = "gui_forget"
path = "tests/gui_forget.rs"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
zkv = { workspace = true }

[profile.release]
strip = true

[workspace]
resolver = "2"
members = ["crates/zkv", "crates/zkv-oracle", "crates/zkv-version-oracle"]
# Directories that may exist inside the repo checkout but are NOT members:
# the regtest harness is deliberately its own workspace (own lockfile; see
# regtest-harness/README.md), and the Regtest E2E CI workflow checks out
# zcash-devtool (the funding wallet) into the repo root, where cargo's
# directory traversal would otherwise try to claim it for this workspace.
exclude = ["regtest-harness", "zcash-devtool"]

[workspace.dependencies]
# Internal crate (path resolved relative to the workspace root, so the faucet
# and these root tests reference it identically).
zkv = { path = "crates/zkv", version = "0.0.1-rc4" }

# Shared third-party deps. Versions live here so the member crates (and the
# workspace-root integration tests) can't drift; per-crate feature sets and
# `optional` / `default-features` stay on the member declaration.
anyhow = "1"
clap = { version = "4.5", features = ["derive", "string"] }
hex = "0.4"
rand = { version = "0.8", default-features = false }
rusqlite = { version = "0.37", features = ["time", "uuid"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.21" }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
axum = { version = "0.7", default-features = false, features = ["tokio", "http1", "json"] }

# Zcash ecosystem: version-locked as a set.
#
# Ironwood (NU6.3 / V6 transaction) support. The consensus-layer crates are
# bumped to their librustzcash Ironwood `-pre` releases; the higher-level wallet
# crates (zcash_client_backend, zcash_client_sqlite) keep their crates.io version
# numbers but must be rebuilt against the `-pre` lower crates, so the whole set is
# repointed at upstream `zcash/librustzcash` main via [patch.crates-io] below
# (the full Ironwood scan model has landed upstream; the zecrocks fork is no
# longer needed).
transparent = { package = "zcash_transparent", version = "0.9.0-pre.0" }
zcash_address = "0.13.0-pre.0"
zcash_note_encryption = "0.4.1"
zcash_client_backend = { version = "0.23", features = ["lightwalletd-tonic-tls-webpki-roots", "orchard", "pczt"] }
zcash_client_sqlite = { version = "0.21", features = ["unstable", "orchard", "serde"] }
zcash_keys = { version = "0.15.0-pre.0", features = ["orchard", "unstable"] }
zcash_primitives = "0.29.0-pre.0"
zcash_protocol = { version = "0.10.0-pre.0", features = ["local-consensus"] }
zip32 = "0.2"
zip321 = "0.8"

# Ironwood (NU6.3 / V6 transaction) support: repoint every librustzcash crate we
# depend on (directly or transitively) to upstream `zcash/librustzcash` main. The
# higher-level crates (zcash_client_backend, zcash_client_sqlite, pczt, zip321)
# keep their crates.io version numbers but depend on the `-pre` lower crates, so
# the crates.io releases can't be used directly: a git source is required. `rev
# d700a59a` is the current head of upstream main, which now carries the full
# **Ironwood scan model** (PR #2539 `dw/ironwood-scan-model`) plus follow-up
# fixes (`Implement missing ironwood support`, #2564 `todo-ironwood`, the
# stabilized proposed-transaction-version API): selecting and spending received
# Ironwood notes, counting them in the account balance, the Orchard-turnstile
# enforcement, V6-PCZT construction for Ironwood targets, and the
# `ironwood_tree_retained_checkpoints` migration table (so the wallet creates it,
# not zkv out of band; see the note in `data.rs`). This previously pointed at the
# zecrocks `ironwood-scan-model` fork; that work is now upstream, so the fork is
# no longer a dependency. Patches must live in the workspace root to take effect.
#
# Upstream main patches two more sources, which we mirror here:
#   - `orchard` to a git rev (keeps `BundleType::DEFAULT` padded and adds the
#     Ironwood bundle fields), NOT the crates.io `0.15.0-pre.2` the old fork
#     used. Our direct `orchard = "=0.15.0-pre.2"` pin in crates/zkv matches the
#     rev's version, so the exact pin resolves against the patched source.
#   - `shardtree`/`incrementalmerkletree`, unreleased (explicit checkpoint
#     retention, #184). We track the latest `zcash/incrementalmerkletree` main
#     (`7b23adb`): upstream `decefc46` plus the shardtree checkpoint-prune
#     retention fixes (#192, `clear_flags` no longer panics "Tree state
#     inconsistent with checkpoints." when pruning collapses densely-packed
#     checkpoint positions into a single pruned leaf). That panic is reachable on
#     a sparsely-used Ironwood tree still checkpointed every block by cross-pool
#     sync, so it is load-bearing. This is now the official upstream fix (it
#     replaces the earlier zecrocks stopgap fork of the same). Same crate
#     versions (shardtree 0.6.2, incrementalmerkletree 0.8.2), still compatible
#     with upstream librustzcash. A `[patch]` only takes effect from the
#     workspace root, so we pin it here.
[patch.crates-io]
equihash = { git = "https://github.com/zcash/librustzcash", rev = "d700a59ac19be4c8292348acfcda3e8353c93ab6" }
f4jumble = { git = "https://github.com/zcash/librustzcash", rev = "d700a59ac19be4c8292348acfcda3e8353c93ab6" }
zcash_address = { git = "https://github.com/zcash/librustzcash", rev = "d700a59ac19be4c8292348acfcda3e8353c93ab6" }
zcash_encoding = { git = "https://github.com/zcash/librustzcash", rev = "d700a59ac19be4c8292348acfcda3e8353c93ab6" }
zcash_protocol = { git = "https://github.com/zcash/librustzcash", rev = "d700a59ac19be4c8292348acfcda3e8353c93ab6" }
zip321 = { git = "https://github.com/zcash/librustzcash", rev = "d700a59ac19be4c8292348acfcda3e8353c93ab6" }
pczt = { git = "https://github.com/zcash/librustzcash", rev = "d700a59ac19be4c8292348acfcda3e8353c93ab6" }
zcash_keys = { git = "https://github.com/zcash/librustzcash", rev = "d700a59ac19be4c8292348acfcda3e8353c93ab6" }
zcash_client_backend = { git = "https://github.com/zcash/librustzcash", rev = "d700a59ac19be4c8292348acfcda3e8353c93ab6" }
zcash_client_sqlite = { git = "https://github.com/zcash/librustzcash", rev = "d700a59ac19be4c8292348acfcda3e8353c93ab6" }
zcash_primitives = { git = "https://github.com/zcash/librustzcash", rev = "d700a59ac19be4c8292348acfcda3e8353c93ab6" }
zcash_proofs = { git = "https://github.com/zcash/librustzcash", rev = "d700a59ac19be4c8292348acfcda3e8353c93ab6" }
zcash_transparent = { git = "https://github.com/zcash/librustzcash", rev = "d700a59ac19be4c8292348acfcda3e8353c93ab6" }

# Ironwood needs an unreleased orchard (padded `BundleType::DEFAULT` + Ironwood
# bundle fields); the same git rev upstream librustzcash main pins.
orchard = { git = "https://github.com/zcash/orchard", rev = "475ef0ff77d45aebff93cb039d639250d82518a3" }

# Unreleased checkpoint-retention APIs (#184) plus the shardtree checkpoint-prune
# retention fixes (#192, the `clear_flags` panic fix). Latest official
# `zcash/incrementalmerkletree` main; 4 commits past the `decefc46` upstream
# librustzcash pins, same crate versions. This is the upstream home of the fix
# the zecrocks incrementalmerkletree stopgap fork used to carry.
shardtree = { git = "https://github.com/zcash/incrementalmerkletree", rev = "7b23adb67044d2a9f4a68759f1e6340c3fc4735a" }
incrementalmerkletree = { git = "https://github.com/zcash/incrementalmerkletree", rev = "7b23adb67044d2a9f4a68759f1e6340c3fc4735a" }
# incrementalmerkletree-testing is a dev-only dep upstream patches for its own
# tests; it is not in zkv's crate graph, so patching it here is unused. Omitted.
