name: Regtest E2E

# Live tier: brings up a zebra (Regtest) node with a lightwalletd in front of
# it and drives the real zkv CLI binary through the full database lifecycle
# (init, fund, INIT, set/get/del, history, roles, watch-only, shallow); see
# regtest-harness/. It also builds zcash-devtool (regtest-enabled) as the
# funding wallet, used to shield a mined transparent coinbase into Orchard and
# fund the zkv wallet (regtest can't mine an Orchard coinbase directly).
# No zingo-infra: the harness mines via zebrad's Regtest-only `generate` RPC,
# so it has no zebra crate dependency and works against any zebrad release.
# zebrad + lightwalletd are extracted from their official Docker images.
#
# Runs on PRs and pushes to main against the pinned zebra image. The weekly
# schedule tests BOTH the pinned image (re-validating the baseline) and
# zfnd/zebra:latest (an early-warning canary for upstream zebra changes).
#
# The pattern (and much of the harness) follows zecd's Regtest E2E workflow.

on:
  workflow_dispatch:
    inputs:
      zebra-image:
        description: "zfnd/zebra image tag to test against (e.g. 5.0.0, latest)"
        required: false
        default: ""
  schedule:
    # Weekly canary against zfnd/zebra:latest (Tuesdays 06:43 UTC; an off-peak
    # odd minute).
    - cron: "43 6 * * 2"
  push:
    # Mainline only: feature branches (incl. claude/**) are covered by the
    # pull_request trigger below, so listing them here too would run every job
    # twice on a PR push.
    branches: [main, master]
    paths:
      - "regtest-harness/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/regtest.yml"
  pull_request:
    paths:
      - "regtest-harness/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/regtest.yml"

# The pinned zebra image used by PR/push runs; the schedule runs `latest` as
# well, and a manual dispatch can name any tag. Bumping zebra = changing this
# one value (the harness drives zebrad purely over JSON-RPC, so nothing else
# needs to move in lockstep).
#
# IMPORTANT: no workflow env var may start with `ZEBRA_`; zebrad parses
# ZEBRA_*-prefixed environment variables as config overrides and exits with
# "unknown field" on ones it doesn't recognise. (The harness also scrubs
# ZEBRA_* before spawning zebrad, as a second line of defence.)
env:
  ZEBRAD_IMAGE_PINNED: "5.0.0"

concurrency:
  group: regtest-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regtest:
    runs-on: ubuntu-latest
    # The Ironwood feature branch activates NU6.3 on its regtest chain, which
    # this tier's stock zebra doesn't know, so the two diverge past the NU6.3
    # height and the e2e can't pass here. That branch's live tier runs in
    # `regtest-ironwood.yml` (Ironwood zebra + dev lwd/devtool images) instead,
    # so skip the stock tier on its PRs. Every other PR / push / schedule runs
    # normally.
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref != 'claude/zkv-ironwood-support-5s6bfn'
    # NB: new harness test files must be added to the matrix `tests` list here
    # (it enumerates --test targets; nothing runs them implicitly).
    #
    # The `image` dimension is "event" except on the weekly schedule, where
    # both the pinned baseline and `latest` run ("event" resolves the tag from
    # the trigger: dispatch input or the pinned default).
    strategy:
      fail-fast: false
      matrix:
        suite: [zkv]
        image: ${{ github.event_name == 'schedule' && fromJSON('["pinned", "latest"]') || fromJSON('["event"]') }}
        include:
          - suite: zkv
            tests: --test regtest_unfunded --test regtest_kv
    name: regtest (${{ matrix.suite }}, ${{ matrix.image }})
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            regtest-harness
            zcash-devtool

      # Release build: writes prove Orchard spends, and debug proving is >20s
      # per transaction; release keeps the harness snappy. The lean CLI build
      # skips the GUI asset/licensing build steps.
      - name: Build zkv (release, lean CLI)
        run: cargo build --release -p zkv --bin zkv --no-default-features --features cli,transparent-inputs

      # The funding wallet: zcash-devtool with regtest support
      # (PR zecrocks/zcash-devtool#1). It shields a mined transparent coinbase
      # into Orchard and sends it to the zkv wallet, since regtest can't mine
      # an Orchard coinbase a shielded wallet would scan.
      # Pinned to the same commit SHA zecd's regtest workflow uses, so the
      # build can't change or vanish under us.
      - name: Checkout zcash-devtool (funder)
        uses: actions/checkout@v4
        with:
          repository: zecrocks/zcash-devtool
          ref: 7ca3ce28ed9f606cdb1e1a6c8ae087cb2c5a2973
          path: zcash-devtool

      # Cache the funder binary keyed on its commit, so devtool is built once
      # per devtool change and skipped entirely on every other run. On a miss,
      # rust-cache (above) still has its dependency tree, so the rebuild is
      # just devtool's own crate.
      - name: Resolve devtool commit
        run: echo "DEVTOOL_SHA=$(git -C zcash-devtool rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Cache the funder binary
        id: devtool-bin
        uses: actions/cache@v4
        with:
          path: zcash-devtool/target/release/zcash-devtool
          key: devtool-bin-${{ runner.os }}-${{ env.DEVTOOL_SHA }}

      - name: Build zcash-devtool (funder)
        if: steps.devtool-bin.outputs.cache-hit != 'true'
        run: cargo build --release --manifest-path zcash-devtool/Cargo.toml --bin zcash-devtool

      # Pick the zebra image. The matrix names it outright on the weekly
      # schedule (pinned + latest legs); otherwise ("event") it comes from the
      # trigger: a manual dispatch's input, or the pinned tag for PR/push runs.
      - name: Select zebra image tag
        run: |
          case "${{ matrix.image }}" in
            pinned) tag="$ZEBRAD_IMAGE_PINNED" ;;
            latest) tag="latest" ;;
            *)
              case "${{ github.event_name }}" in
                workflow_dispatch) tag="${{ inputs.zebra-image }}"; tag="${tag:-$ZEBRAD_IMAGE_PINNED}" ;;
                *) tag="$ZEBRAD_IMAGE_PINNED" ;;
              esac
              ;;
          esac
          echo "Testing against zfnd/zebra:$tag"
          echo "ZEBRAD_IMAGE_TAG=$tag" >> "$GITHUB_ENV"

      # Extract zebrad + lightwalletd from their official Docker images. The
      # harness drives zebrad over JSON-RPC only (mining via the Regtest-only
      # `generate` RPC), so any zebrad release works. The harness reads
      # ZEBRAD_BIN/LIGHTWALLETD_BIN.
      - name: Provision zebrad + lightwalletd from images
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          extract() {
            img="$1"; name="$2"; out="$RUNNER_TEMP/bin/$name"
            docker pull -q "$img"
            cid=$(docker create "$img")
            rel=$(docker export "$cid" | tar -tf - | grep -m1 -E "(^|/)${name}\$" || true)
            if [ -z "$rel" ]; then echo "::error::could not locate $name in $img"; docker rm "$cid" >/dev/null; exit 1; fi
            docker cp "$cid:/$rel" "$out"
            docker rm "$cid" >/dev/null
            chmod +x "$out"
            echo "$name -> $out"; file -b "$out" || true
          }
          extract "zfnd/zebra:$ZEBRAD_IMAGE_TAG" zebrad
          extract electriccoinco/lightwalletd:v0.4.19 lightwalletd
          echo "ZEBRAD_BIN=$RUNNER_TEMP/bin/zebrad" >> "$GITHUB_ENV"
          echo "LIGHTWALLETD_BIN=$RUNNER_TEMP/bin/lightwalletd" >> "$GITHUB_ENV"

      # The harness is its own workspace, so the root ci.yml's clippy never
      # sees it; lint it here where it is already being compiled.
      - name: Clippy (harness)
        run: cargo clippy --all-targets --locked --manifest-path regtest-harness/Cargo.toml -- -D warnings

      - name: Run regtest end-to-end harness
        env:
          ZKV_BIN: ${{ github.workspace }}/target/release/zkv
          DEVTOOL_BIN: ${{ github.workspace }}/zcash-devtool/target/release/zcash-devtool
          # Capture zebrad's logs so a startup failure is diagnosable from the
          # CI run.
          ZEBRAD_STDERR: ${{ runner.temp }}/zebrad.log
          # ZEBRAD_BIN / LIGHTWALLETD_BIN are exported by the provisioning
          # step above.
        # --locked: build against the committed lock. Single-threaded: two
        # zebrad+lightwalletd stacks plus Orchard proving would contend badly
        # on a 2-core runner. --no-fail-fast: run every test binary even if an
        # earlier one fails.
        run: cargo test --locked --manifest-path regtest-harness/Cargo.toml ${{ matrix.tests }} --no-fail-fast -- --nocapture --test-threads=1

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "== disk =="
          df -h / "$RUNNER_TEMP" || true
          echo "== zebrad log (last 200 lines) =="
          tail -n 200 "$RUNNER_TEMP/zebrad.log" 2>/dev/null || echo "(no zebrad log was written)"
