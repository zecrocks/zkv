[package]
name = "zkv-oracle"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Production CoinGecko price oracle that publishes ZEC/USD and BTC/USD to a zkv database."
publish = false

[[bin]]
name = "zkv-oracle"
path = "src/main.rs"

[dependencies]
# The facade needs neither the CLI nor GUI feature trees; keep the build lean
# (no clap/qrcode/axum-from-gui/license-bundle).
zkv = { path = "../zkv", version = "0.0.1-rc3", default-features = false, features = ["transparent-inputs"] }

anyhow = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.21", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Health-gate HTTP server.
axum = { version = "0.7", default-features = false, features = ["tokio", "http1", "json"] }

# CoinGecko HTTP client. rustls so the runtime image needs no system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
